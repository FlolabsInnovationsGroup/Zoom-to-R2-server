[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zoom-archive"
version = "0.1.0"
description = "Zoom cloud recording archiver to Cloudflare R2, plus the admin page and MCP server (FloLabs)"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.31",
  "boto3>=1.34",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "tzdata>=2024.1",
  "starlette>=0.40",
  "uvicorn>=0.30",
  "mcp>=1.9,<2",
  "itsdangerous>=2.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "moto[server]>=5.0",
  "jsonschema>=4.20",
  "httpx>=0.27",
]

[project.scripts]
zoom-archive = "zoom_archive.cli:main"

[tool.setuptools]
packages = ["zoom_archive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
